<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskForge — open-source task tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-top">
        <h1 data-i18n="heading">TaskForge</h1>
        <select id="lang-switch" class="lang-switch" data-i18n-lang-switch aria-label="Language">
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </div>
      <p class="tagline" data-i18n="tagline">A tiny task list that lives in your browser.</p>
    </header>

    <main class="app-main">
      <form id="task-form" class="task-form" aria-label="Add a new task">
        <input
          id="task-input"
          type="text"
          name="title"
          data-i18n-placeholder="placeholder"
          placeholder="What needs doing?"
          autocomplete="off"
          required
        />
        <button type="submit" data-i18n="addButton">Add</button>
      </form>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <p id="empty-state" class="empty-state" data-i18n="emptyState" hidden>
        No tasks yet. Add one above to get started.
      </p>
    </main>

    <footer class="app-footer">
      <a href="https://github.com/CodeBountyOrg/taskforge-demo">
        github.com/CodeBountyOrg/taskforge-demo
      </a>
    </footer>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
